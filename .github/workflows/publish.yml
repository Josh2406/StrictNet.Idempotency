name: Publish to NuGet

on:
  release:
    types: [ published ]

jobs:
  deploy:
    name: Package & Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 🛠️ FIX: Install all targeted SDKs so multi-targeting compiles perfectly on release
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          10.0.x

    # Extract version number from the git release tag (e.g., v1.2.3 -> 1.2.3)
    - name: Extract Version
      id: get_version
      run: |
        TAG_NAME="${{ github.event.release.tag_name }}"
        VERSION="${TAG_NAME#v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Restore Dependencies
      run: dotnet restore

    # Build and Pack using the dynamic version matching your GitHub release
    - name: Pack NuGet Package
      run: |
        dotnet pack --configuration Release \
          -p:PackageVersion=${{ env.VERSION }} \
          --output ./artifacts

    # Push to NuGet using your secure repository secret
    - name: Push to NuGet.org
      run: |
        dotnet nuget push "./artifacts/*.nupkg" \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://nuget.org \
          --skip-duplicate
